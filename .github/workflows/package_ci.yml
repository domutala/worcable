name: CI

on:
  push:
    branches:
      - main
      - dev
      - "release/*"

env:
  REGISTRY: docker.io
  IMAGE_NAME: domutala/worcable-package

jobs:
  push-docker-image:
    runs-on: ubuntu-latest
    name: Build and Publish Docker Image
    outputs:
      docker_tag: ${{ steps.set-tag.outputs.tag }}
      safe_branch: ${{ steps.set-tag.outputs.branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=sha,format=short

      - name: Set outputs
        id: set-tag
        run: |
          # 1. Nettoyage du nom de branche (pour les noms de dossiers VPS)
          SAFE_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "branch=$SAFE_NAME" >> $GITHUB_OUTPUT

          # 2. Logique de Tag Docker
          if [ "${{ github.ref_name }}" == "main" ]; then
              # Règle 1: Main -> latest
              echo "tag=latest" >> $GITHUB_OUTPUT
              
          elif [[ "${{ github.ref_name }}" =~ ^release/ ]]; then
              # Règle 2: release/v1.0 -> v1.0
              # On récupère tout ce qui est après le dernier '/'
              VERSION=${{ github.ref_name }}
              echo "tag=${VERSION#*/}" >> $GITHUB_OUTPUT
              
          else
              # Règle 3: Autre -> sha-short (fourni par metadata-action)
              # metadata-action génère un tag de type 'sha-xxxxxxx' avec type=sha
              # On récupère le format court via github.sha
              SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
              echo "tag=sha-$SHORT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./package
          file: ./package/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_APP_VERSION=${{ steps.set-tag.outputs.tag }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./package/docker/README.md

  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: push-docker-image
    if: success()

    env:
      BASE_DIR: /home/${{ secrets.SSH_USER }}/worcable

    steps:
      - name: Checkout repository (to get docker-compose.yaml)
        uses: actions/checkout@v4

      - name: Determine Port
        id: port
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "number=3000" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "number=3001" >> $GITHUB_OUTPUT
          else
            echo "number=3002" >> $GITHUB_OUTPUT
          fi

      - name: Create directory and Copy docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p "${{ env.BASE_DIR }}/package-${{ needs.push-docker-image.outputs.safe_branch }}"

      - name: Copy docker-compose.yaml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "package/docker-compose.yaml"
          target: "${{ env.BASE_DIR }}/package-${{ needs.push-docker-image.outputs.safe_branch }}"

      - name: Copy docker/deploy.sh
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "package/docker/deploy.sh"
          target: "${{ env.BASE_DIR }}/package-${{ needs.push-docker-image.outputs.safe_branch }}"

          strip_components: 1

      - name: Execute Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # On définit le chemin cible
            TARGET_DIR="${{ env.BASE_DIR }}package-${{ needs.push-docker-image.outputs.safe_branch }}"

            # Connexion Docker Hub (plus sécurisé de le faire ici)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Rendre exécutable le script (qui a été copié dans le dossier cible)
            chmod +x $TARGET_DIR/deploy.sh

            $TARGET_DIR/deploy.sh \
              "${{ needs.push-docker-image.outputs.docker_tag }}" \
              "${{ needs.push-docker-image.outputs.safe_branch }}" \
              "${{ vars.DEPLOY_BASE_URL }}" \
              "${{ secrets.MONGO_DB_USER }}" \
              "${{ secrets.MONGO_DB_PWD }}" \
              "${{ env.BASE_DIR }}"
