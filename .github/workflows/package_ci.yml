name: package_push_docker

on:
  push:
    branches:
      - main
      - dev
      - "release/*"

env:
  REGISTRY: docker.io
  IMAGE_NAME: domutala/worcable-package

jobs:
  push-docker-image:
    runs-on: ubuntu-latest
    # On définit les outputs pour que le job 'deploy' puisse les lire
    outputs:
      docker_tag: ${{ steps.set-tag.outputs.tag }}
      safe_branch: ${{ steps.set-tag.outputs.branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=sha,format=short

      - name: Set outputs
        id: set-tag
        run: |
          # 1. Nettoyage du nom de branche (remplace / par -)
          SAFE_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "branch=$SAFE_NAME" >> $GITHUB_OUTPUT

          # 2. Choix du tag Docker (latest pour main, sinon safe_branch)
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "tag=$SAFE_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./package
          file: ./package/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_APP_VERSION=${{ steps.set-tag.outputs.tag }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./package/docker/README.md

  deploy:
    runs-on: ubuntu-latest
    needs: push-docker-image
    # Le job s'exécute uniquement si le build a réussi
    if: success()

    steps:
      - name: Checkout repository (to get docker-compose.yaml)
        uses: actions/checkout@v4

      - name: Determine Port
        id: port
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "number=3000" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "number=3001" >> $GITHUB_OUTPUT
          else
            echo "number=3002" >> $GITHUB_OUTPUT
          fi

      - name: Create directory and Copy docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p /home/${{ secrets.SSH_USER }}/worcable/package-${{ needs.push-docker-image.outputs.safe_branch }}

      - name: Copy docker-compose.yaml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./package/docker-compose.yaml"
          target: "/home/${{ secrets.SSH_USER }}/worcable/package-${{ needs.push-docker-image.outputs.safe_branch }}"
          strip_components: 1

      - name: Execute Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # On définit le chemin absolu pour éviter toute confusion
            TARGET_DIR="/home/${{ secrets.SSH_USER }}/worcable/package-${{ needs.push-docker-image.outputs.safe_branch }}"

            cd $TARGET_DIR || exit 1

            # Vérification de présence du fichier (debug)
            ls -la docker-compose.yaml

            # Création du .env
            cat <<EOF > .env
            IMAGE_TAG=${{ needs.push-docker-image.outputs.docker_tag }}
            BRANCH_NAME=${{ needs.push-docker-image.outputs.safe_branch }}
            HOST_PORT=${{ steps.port.outputs.number }}
            EOF

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # Utilisation explicite du fichier si nécessaire
            docker compose pull
            docker compose up -d --remove-orphans
