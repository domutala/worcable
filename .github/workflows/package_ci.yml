name: CI

on:
  push:
    branches:
      - main
      - dev
      - "release/*"

env:
  REGISTRY: docker.io
  IMAGE_NAME: domutala/worcable-package

jobs:
  push-docker-image:
    runs-on: ubuntu-latest
    name: Build and Publish Docker Image
    outputs:
      docker_tag: ${{ steps.set-tag.outputs.tag }}
      safe_branch: ${{ steps.set-tag.outputs.branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=sha,format=short

      - name: Set outputs
        id: set-tag
        run: |
          # 1. Nettoyage du nom de branche (pour les noms de dossiers VPS)
          SAFE_NAME=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          echo "branch=$SAFE_NAME" >> $GITHUB_OUTPUT

          # 2. Logique de Tag Docker
          if [ "${{ github.ref_name }}" == "main" ]; then
              # Règle 1: Main -> latest
              echo "tag=latest" >> $GITHUB_OUTPUT
              
          elif [[ "${{ github.ref_name }}" =~ ^release/ ]]; then
              # Règle 2: release/v1.0 -> v1.0
              # On récupère tout ce qui est après le dernier '/'
              VERSION=${{ github.ref_name }}
              echo "tag=${VERSION#*/}" >> $GITHUB_OUTPUT
              
          else
              # Règle 3: Autre -> sha-short (fourni par metadata-action)
              # metadata-action génère un tag de type 'sha-xxxxxxx' avec type=sha
              # On récupère le format court via github.sha
              SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
              echo "tag=sha-$SHORT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./package
          file: ./package/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NUXT_PUBLIC_APP_VERSION=${{ steps.set-tag.outputs.tag }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./package/docker/README.md

  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: push-docker-image
    if: success()

    steps:
      - name: Checkout repository (to get docker-compose.yaml)
        uses: actions/checkout@v4

      - name: Determine Port
        id: port
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "number=3000" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "number=3001" >> $GITHUB_OUTPUT
          else
            echo "number=3002" >> $GITHUB_OUTPUT
          fi

      - name: Create directory and Copy docker-compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p /home/${{ secrets.SSH_USER }}/worcable/package-${{ needs.push-docker-image.outputs.safe_branch }}

      - name: Copy docker-compose.yaml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "package/docker-compose.yaml"
          target: "/home/${{ secrets.SSH_USER }}/worcable/package-${{ needs.push-docker-image.outputs.safe_branch }}"

          strip_components: 1

      - name: Execute Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            TARGET_DIR="/home/${{ secrets.SSH_USER }}/worcable/package-${{ needs.push-docker-image.outputs.safe_branch }}"
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR || exit 1

            # --- 1. Logique de Port Dynamique ---
            BRANCH="${{ needs.push-docker-image.outputs.safe_branch }}"

            # Port suggéré par défaut
            if [ "$BRANCH" == "main" ]; then SUGGESTED_PORT=3000;
            elif [ "$BRANCH" == "dev" ]; then SUGGESTED_PORT=3001;
            else SUGGESTED_PORT=3002; fi

            # Fonction pour vérifier si un port est libre
            is_port_free() {
              # On vérifie si le port est écouté localement
              ! ss -tuln | grep -q ":$1 "
            }

            FINAL_PORT=$SUGGESTED_PORT
            if ! is_port_free $FINAL_PORT; then
              echo "⚠️  Port $FINAL_PORT is busy. Searching for a free port..."
              # On cherche un port libre entre 3005 et 3999
              for port in {3005..3999}; do
                if is_port_free $port; then
                  FINAL_PORT=$port
                  break
                fi
              done
            fi
            echo "✅ Using Port: $FINAL_PORT"

            # --- 2. Logique de Formatage des URLs ---
            if [ "$BRANCH" == "main" ]; then
              DOMAIN="${{ vars.DEPLOY_BASE_URL }}"
              APP_URL="https://${{ vars.DEPLOY_BASE_URL }}"
              DB_NAME="worcable_prod"
            else
              DOMAIN="$BRANCH.sandbox.${{ vars.DEPLOY_BASE_URL }}"
              APP_URL="https://$BRANCH.sandbox.${{ vars.DEPLOY_BASE_URL }}"
              DB_NAME="worcable_${BRANCH}_sandbox"
            fi

            # --- 3. Gestion de la NUXT_SECRET_KEY ---
            if [ -f "package.env" ] && grep -q "NUXT_SECRET_KEY=" package.env; then
              SECRET_KEY=$(grep "NUXT_SECRET_KEY=" package.env | cut -d'=' -f2-)
            else
              SECRET_KEY=$(openssl rand -base64 48 | tr -d '\n')
            fi

            # --- 4. Création des fichiers ---
            cat <<EOF > .env
            IMAGE_TAG=${{ needs.push-docker-image.outputs.docker_tag }}
            BRANCH_NAME=$BRANCH
            HOST_PORT=$FINAL_PORT
            DOMAIN=$DOMAIN
            EOF

            cat <<EOF > package.env
            PORT=$FINAL_PORT
            NUXT_PUBLIC_APP_URL=$APP_URL
            NUXT_DATABASE_URL="mongodb+srv://${{ secrets.MONGO_DB_USER }}:${{ secrets.MONGO_DB_PWD }}@cluster0.l1qnkbx.mongodb.net/$DB_NAME"
            NUXT_SECRET_KEY=$SECRET_KEY
            EOF

            # --- 5. Déploiement ---
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
