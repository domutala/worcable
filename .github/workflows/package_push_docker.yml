name: package_push_docker

on:
  push:
    branches:
      - main
      - dev
      - "release/*"

env:
  REGISTRY: docker.io
  IMAGE_NAME: domutala/worcable-package

jobs:
  push-docker-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
            type=sha,format=short

      - name: Set output tag
        id: set-tag
        run: |
          # On prend le premier tag généré (le plus précis)
          TAG=$(echo "${{ steps.meta.outputs.version }}")
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./package
          file: ./package/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          # cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            NUXT_PUBLIC_APP_VERSION=${{ steps.meta.outputs.tags }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: ./package/docker/README.md
          short-description: Official Docker image for the main service of Worcable

  deploy:
    runs-on: ubuntu-latest
    needs: push-docker-image
    if: needs.push-docker-image.result == 'success'

    steps:
      - run: echo '${{ toJSON(needs.push-docker-image.outputs) }}'
