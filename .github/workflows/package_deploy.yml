name: Deploy

on:
  workflow_run:
    workflows: ["Build and Publish Docker Image"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Get Tag from Build Workflow
        id: get_vars
        run: |
          # GitHub Actions stocke la branche source ici
          RAW_BRANCH="${{ github.event.workflow_run.head_branch }}"
          # Clean name pour le dossier (ex: release/v1 -> release-v1)
          SAFE_NAME=$(echo "$RAW_BRANCH" | sed 's/\//-/g')

          # On détermine le tag Docker : si main -> latest, sinon nom de la branche
          if [ "$RAW_BRANCH" == "main" ]; then
            DOCKER_TAG="latest"
          else
            DOCKER_TAG="$SAFE_NAME"
          fi

          echo "branch_name=$SAFE_NAME" >> $GITHUB_OUTPUT
          echo "docker_tag=$DOCKER_TAG" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # On utilise les variables générées au dessus
            TARGET_DIR="/home/${{ secrets.SSH_USER }}/worcable/package-${{ steps.get_vars.outputs.branch_name }}"
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR

            # Création du .env dynamique
            cat <<EOF > .env
            IMAGE_TAG=${{ steps.get_vars.outputs.docker_tag }}
            BRANCH_NAME=${{ steps.get_vars.outputs.branch_name }}
            HOST_PORT=${{ steps.get_vars.outputs.docker_tag == 'latest' && '3000' || '3001' }}
            EOF

            docker compose pull
            docker compose up -d --remove-orphans
