name: Release CLI

on:
  push:
    branches:
      - main
      - develop
      - "release/*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm' # or 'yarn'

      - name: Install dependencies
        run: pnpm install 


