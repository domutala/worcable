name: Release CLI

on:
  push:
    branches:
      - main
      - develop
      - "release/*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: npm i -g --force corepack && corepack enable

      - name: Install dependencies
        run: |
          cd cli
          pnpm install --frozen-lockfile
          pnpm build

      - uses: oven-sh/setup-bun@v1
      - name: Build CLI
        run: |
          bun build src/index.ts --compile --outfile worcable

      - name: Rename binary
        run: mv cli/worcable worcable-linux

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: worcable-linux
          
