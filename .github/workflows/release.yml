name: Release CLI

on:
  push:
    branches:
      - main
      - develop
      - "release/*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Build CLI
        run: |
          cd cli
          pnpm install --frozen-lockfile
          pnpm run build
          bun build src/index.ts --compile --outfile worcable

      - name: Rename binary
        run: mv cli/worcable worcable-linux

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: worcable-linux
