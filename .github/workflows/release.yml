name: Build CLI

on:
  push:
    branches:
      - develop
   
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      tag_name: ${{ steps.tag-name.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Set tag name
        id: tag-name
        run: echo "name=cli" >> $GITHUB_OUTPUT
      - name: Create tag
        run: |
          TAG="${{ steps.tag-name.outputs.name }}"

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Tag already exists on remote"
          else
            git tag $TAG
          fi

          git push origin $TAG

      - name: Enable Corepack
        run: npm i -g --force corepack && corepack enable

      - name: Install dependencies
        run: |
          cd cli
          pnpm install --frozen-lockfile
          pnpm build

      - uses: oven-sh/setup-bun@v1

      - name: Build CLI
        run: |
          cd cli
          bun build src/index.ts --compile --outfile worcable

      - name: Rename binary
        run: mv cli/worcable worcable-linux

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: worcable-linux
          tag_name: ${{ steps.tag-name.outputs.name }}
