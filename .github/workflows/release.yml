name: Release CLI

on:
  push:
    branches:
      - develop
    # tags:
    #   - "cli/*"
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create tag
        run: |
          TAG="cli-${{ github.ref_name }}"

          echo "Checking if tag $TAG exists..."

          if git ls-remote --tags origin | grep -q "refs/tags/$TAG"; then
            echo "Tag already exists on remote"
          else
            git tag $TAG
            git push origin $TAG
          fi

          git push origin $TAG

      - name: Enable Corepack
        run: npm i -g --force corepack && corepack enable

      - name: Install dependencies
        run: |
          cd cli
          pnpm install --frozen-lockfile
          pnpm build

      - uses: oven-sh/setup-bun@v1

      - name: Build CLI
        run: |
          cd cli
          bun build src/index.ts --compile --outfile worcable

      - name: Rename binary
        run: mv cli/worcable worcable-linux

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: worcable-linux
          tag_name: cli-${{ github.ref_name }}

# git push origin cli/1.0.0